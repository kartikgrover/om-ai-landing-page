# GitHub Pages builds this repo with Jekyll (no .nojekyll, removed 2026-09-17 so
# exclude works). Jekyll drops dot-directories, so .well-known is re-included:
#   .well-known/apple-app-site-association -> iOS universal links (omai.app/r)
#   .well-known/assetlinks.json            -> Android App Links
include:
  - .well-known

# Repo-only files. Setting exclude replaces Jekyll's defaults, so
# node_modules/Gemfile/vendor are restated.
exclude:
  - CLAUDE.md
  - STYLING.md
  - docs/
  - tools/
  - package.json
  - node_modules/
  - Gemfile
  - Gemfile.lock
  - vendor/
